name: Build VideoExporter for Godot 4.6.3

on:
  workflow_dispatch:

jobs:
  build-videoexporter:

    name: VideoExporter - Godot 4.6.3

    runs-on: macos-15-intel

    steps:

      # ==========================================================
      # 0. CHECKOUT DO REPOSITÓRIO VIDEOEXPORTER
      # ==========================================================

      - name: Checkout VideoExporter repository
        uses: actions/checkout@v4


      # ==========================================================
      # 1. VERIFICAR AMBIENTE
      # ==========================================================

      - name: Show environment
        run: |
          echo "===== macOS ====="
          sw_vers

          echo ""
          echo "===== Architecture ====="
          uname -m

          echo ""
          echo "===== Xcode ====="
          xcodebuild -version

          echo ""
          echo "===== Xcode Path ====="
          xcode-select -p

          echo ""
          echo "===== Clang ====="
          clang --version

          echo ""
          echo "===== Git ====="
          git --version

          echo ""
          echo "===== Python ====="
          python3 --version


      # ==========================================================
      # 2. INSTALAR SCONS
      # ==========================================================

      - name: Install SCons
        run: |
          brew install scons
          scons --version


      # ==========================================================
      # 3. VERIFICAR ARQUIVOS DO VIDEOEXPORTER
      # ==========================================================

      - name: Verify VideoExporter files
        shell: bash
        run: |

          echo "===== VideoExporter files ====="

          find plugins/video_exporter \
            -maxdepth 1 \
            -type f \
            -print

          echo ""

          for file in \
            plugins/video_exporter/video_exporter.h \
            plugins/video_exporter/video_exporter.mm \
            plugins/video_exporter/video_exporter.gdip
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi
          done

          echo "OK: All VideoExporter files found."


      # ==========================================================
      # 4. CLONAR GODOT IOS PLUGINS
      # ==========================================================

      - name: Clone godot-ios-plugins
        run: |
          git clone --recursive \
            https://github.com/godot-sdk-integrations/godot-ios-plugins.git

          cd godot-ios-plugins

          echo ""
          echo "===== Initial repository commit ====="
          git rev-parse HEAD


      # ==========================================================
      # 5. SELECIONAR GODOT 4.6.3
      # ==========================================================

      - name: Checkout Godot 4.6.3
        run: |
          cd godot-ios-plugins/godot

          git fetch --tags

          git checkout 4.6.3-stable

          echo ""
          echo "===== Godot version ====="
          git describe --tags --always

          echo ""
          echo "===== Godot commit ====="
          git rev-parse HEAD


      # ==========================================================
      # 6. ATUALIZAR SUBMODULES
      # ==========================================================

      - name: Update submodules
        run: |
          cd godot-ios-plugins

          git submodule update --init --recursive


      # ==========================================================
      # 7. INSTALAR VIDEOEXPORTER NO GODOT IOS PLUGINS
      # ==========================================================

      - name: Install VideoExporter source
        shell: bash
        run: |

          echo "======================================"
          echo "VIDEOEXPORTER SOURCE"
          echo "======================================"

          find plugins/video_exporter \
            -maxdepth 1 \
            -type f \
            -print

          echo ""
          echo "======================================"
          echo "CREATE VIDEOEXPORTER DIRECTORY"
          echo "======================================"

          mkdir -p \
            godot-ios-plugins/plugins/video_exporter

          echo ""
          echo "======================================"
          echo "COPY VIDEOEXPORTER FILES"
          echo "======================================"

          cp \
            plugins/video_exporter/video_exporter.h \
            godot-ios-plugins/plugins/video_exporter/video_exporter.h

          cp \
            plugins/video_exporter/video_exporter.mm \
            godot-ios-plugins/plugins/video_exporter/video_exporter.mm

          cp \
            plugins/video_exporter/video_exporter.gdip \
            godot-ios-plugins/plugins/video_exporter/video_exporter.gdip

          echo ""
          echo "======================================"
          echo "INSTALLED VIDEOEXPORTER"
          echo "======================================"

          find godot-ios-plugins/plugins/video_exporter \
            -maxdepth 1 \
            -type f \
            -print


      # ==========================================================
      # 7.1 INSPECIONAR VIDEOEXPORTER
      # ==========================================================

      - name: Inspect VideoExporter
        shell: bash
        run: |

          cd godot-ios-plugins

          echo "======================================"
          echo "VIDEOEXPORTER DIRECTORY"
          echo "======================================"

          find plugins/video_exporter \
            -maxdepth 1 \
            -type f \
            -print

          echo ""
          echo "======================================"
          echo "INIT / DEINIT"
          echo "======================================"

          grep -R \
            -n \
            -E \
            'godot_video_exporter_init|godot_video_exporter_deinit' \
            plugins/video_exporter

          echo ""
          echo "======================================"
          echo "VIDEOEXPORTER GDIP"
          echo "======================================"

          cat plugins/video_exporter/video_exporter.gdip


      # ==========================================================
      # 8. REGISTRAR VIDEOEXPORTER NO SCONSTRUCT
      # ==========================================================

      - name: Register VideoExporter in SConstruct
        shell: bash
        run: |

          cd godot-ios-plugins

          echo "======================================"
          echo "CURRENT PLUGIN ENUM"
          echo "======================================"

          grep -n \
            "EnumVariable('plugin'" \
            SConstruct

          echo ""
          echo "======================================"
          echo "REGISTER VIDEOEXPORTER"
          echo "======================================"

          python3 <<'PY'
          from pathlib import Path

          path = Path("SConstruct")
          text = path.read_text()

          if "'video_exporter'" in text:
              print("VideoExporter already registered.")
              raise SystemExit(0)

          old = (
              "['', 'apn', 'arkit', 'camera', 'icloud', "
              "'gamecenter', 'inappstore', 'photo_picker']"
          )

          new = (
              "['', 'apn', 'arkit', 'camera', 'icloud', "
              "'gamecenter', 'inappstore', 'photo_picker', "
              "'video_exporter']"
          )

          if old not in text:
              print("ERROR: Expected plugin list not found.")
              raise SystemExit(1)

          text = text.replace(old, new, 1)

          path.write_text(text)

          print("VideoExporter registered successfully.")
          PY

          echo ""
          echo "======================================"
          echo "VERIFY VIDEOEXPORTER REGISTRATION"
          echo "======================================"

          grep -n \
            "EnumVariable('plugin'" \
            SConstruct

          if ! grep -q \
            "'video_exporter'" \
            SConstruct
          then
            echo "ERROR: video_exporter was not registered."
            exit 1
          fi

          echo ""
          echo "OK: VideoExporter registered."


      # ==========================================================
      # 9. VERIFICAR VIDEOEXPORTER
      # ==========================================================

      - name: Verify VideoExporter source
        shell: bash
        run: |

          cd godot-ios-plugins

          echo "======================================"
          echo "VERIFY FRAMEWORKS"
          echo "======================================"

          for framework in \
            'AVFoundation.framework' \
            'CoreGraphics.framework' \
            'CoreMedia.framework' \
            'CoreVideo.framework' \
            'UIKit.framework'
          do
            if ! grep -q "$framework" \
              plugins/video_exporter/video_exporter.gdip
            then
              echo "ERROR: Missing $framework"
              exit 1
            fi

            echo "OK: $framework"
          done


          echo ""
          echo "======================================"
          echo "VERIFY INITIALIZATION"
          echo "======================================"

          grep -q \
            'initialization="godot_video_exporter_init"' \
            plugins/video_exporter/video_exporter.gdip \
            || {
              echo "ERROR: initialization missing."
              exit 1
            }

          grep -q \
            'deinitialization="godot_video_exporter_deinit"' \
            plugins/video_exporter/video_exporter.gdip \
            || {
              echo "ERROR: deinitialization missing."
              exit 1
            }

          echo "OK: initialization"
          echo "OK: deinitialization"


          echo ""
          echo "======================================"
          echo "VERIFY HEADER"
          echo "======================================"

          grep -q \
            'class VideoExporter' \
            plugins/video_exporter/video_exporter.h \
            || {
              echo "ERROR: VideoExporter class missing."
              exit 1
            }

          grep -q \
            'export_frames' \
            plugins/video_exporter/video_exporter.h \
            || {
              echo "ERROR: export_frames API missing."
              exit 1
            }

          echo "OK: VideoExporter class"
          echo "OK: export_frames"


          echo ""
          echo "======================================"
          echo "VERIFY IMPLEMENTATION"
          echo "======================================"

          for symbol in \
            'AVAssetWriter' \
            'AVAssetWriterInput' \
            'AVAssetWriterInputPixelBufferAdaptor' \
            'AVFileTypeMPEG4' \
            'AVVideoCodecTypeH264' \
            'CVPixelBuffer' \
            'CMTimeMake' \
            'appendPixelBuffer' \
            'finishWritingWithCompletionHandler'
          do
            if ! grep -q "$symbol" \
              plugins/video_exporter/video_exporter.mm
            then
              echo "ERROR: Missing symbol: $symbol"
              exit 1
            fi

            echo "OK: $symbol"
          done


          echo ""
          echo "======================================"
          echo "VERIFY SINGLETON"
          echo "======================================"

          grep -q \
            'register_singleton' \
            plugins/video_exporter/video_exporter.mm \
            || {
              echo "ERROR: register_singleton missing."
              exit 1
            }

          grep -q \
            '"VideoExporter"' \
            plugins/video_exporter/video_exporter.mm \
            || {
              echo "ERROR: VideoExporter singleton missing."
              exit 1
            }

          echo "OK: singleton"


      # ==========================================================
      # 10. AJUSTAR IOS DEPLOYMENT TARGET
      # ==========================================================

      - name: Set iOS deployment target to 15.0
        shell: bash
        run: |

          cd godot-ios-plugins

          echo "======================================"
          echo "CURRENT IOS DEPLOYMENT TARGET"
          echo "======================================"

          grep -n \
            -E \
            'mios-simulator-version-min|miphoneos-version-min' \
            SConstruct \
            || true

          echo ""
          echo "======================================"
          echo "SETTING IOS 15.0"
          echo "======================================"

          sed -i '' \
            's/-mios-simulator-version-min=12\.0/-mios-simulator-version-min=15.0/g' \
            SConstruct

          sed -i '' \
            's/-miphoneos-version-min=12\.0/-miphoneos-version-min=15.0/g' \
            SConstruct

          echo ""
          echo "======================================"
          echo "VERIFY IOS 15.0"
          echo "======================================"

          grep -n \
            -E \
            'mios-simulator-version-min|miphoneos-version-min' \
            SConstruct

          if grep -q \
            -E \
            'mios-simulator-version-min=12\.0|miphoneos-version-min=12\.0' \
            SConstruct
          then
            echo "ERROR: iOS 12 target remains."
            exit 1
          fi

          echo "OK: iOS deployment target 15.0."


      # ==========================================================
      # 10.1 CORRIGIR INCLUDE PATH DO GODOT 4
      # ==========================================================

      - name: Fix Godot 4 include path
        shell: bash
        run: |
          cd godot-ios-plugins

          echo "======================================"
          echo "CURRENT SCONSTRUCT HEADER PATH"
          echo "======================================"

          sed -n '145,165p' SConstruct

          echo ""
          echo "======================================"
          echo "FIXING GODOT 4 INCLUDE PATH"
          echo "======================================"

          sed -i '' 's#godot/platform/ios#godot/platform/iphone#' SConstruct

          echo ""
          echo "======================================"
          echo "VERIFY CORRECTION"
          echo "======================================"

          sed -n '145,165p' SConstruct


      # ==========================================================
      # DEBUG - INSPECIONAR GODOT IOS PLUGINS
      # ==========================================================

      - name: Inspect SConstruct and generate_xcframework
        shell: bash
        run: |
          cd godot-ios-plugins

          echo "======================================"
          echo "SConstruct"
          echo "======================================"

          sed -n '1,260p' SConstruct

          echo ""
          echo "======================================"
          echo "generate_xcframework.sh"
          echo "======================================"

          sed -n '1,260p' scripts/generate_xcframework.sh
      - name: Inspect Godot binder generator
        shell: bash
        run: |
          cd godot-ios-plugins/godot

          echo "======================================"
          echo "MAKE BINDERS"
          echo "======================================"

          ls -l core/make_binders.py

          echo ""
          echo "======================================"
          echo "MAKE BINDERS FUNCTIONS"
          echo "======================================"

          grep -n "def " core/make_binders.py | head -30

          echo ""
          echo "======================================"
          echo "CORE SCsub BINDER GENERATION"
          echo "======================================"

          grep -n -A5 -B3 "method_bind.gen.inc" core/SCsub
    
      # ==========================================================
      # 11. GERAR SOMENTE METHOD BINDERS
      # ==========================================================

      - name: Generate Godot method binders
        shell: bash
        run: |
          cd godot-ios-plugins/godot

          echo "======================================"
          echo "GENERATING METHOD BINDERS"
          echo "======================================"

          scons \
            platform=ios \
            target=release \
            core/method_bind.gen.inc \
            core/method_bind_ext.gen.inc \
            core/method_bind_free_func.gen.inc

          echo ""
          echo "======================================"
          echo "VERIFY GENERATED FILES"
          echo "======================================"

          ls -lh \
            core/method_bind.gen.inc \
            core/method_bind_ext.gen.inc \
            core/method_bind_free_func.gen.inc        
  
            
      # ==========================================================
      # 12. BUILD RELEASE DEVICE
      # ==========================================================

      - name: Build VideoExporter release device
        run: |

          cd godot-ios-plugins

          scons \
            target=release \
            arch=arm64 \
            plugin=video_exporter \
            version=4.0 \
            ios_deployment_target=15.0 \
            custom_cppflags="-Igodot/platform/iphone"


      # ==========================================================
      # 13. BUILD RELEASE SIMULATOR X86_64
      # ==========================================================

      - name: Build VideoExporter release simulator x86_64
        run: |

          cd godot-ios-plugins

          scons \
            target=release \
            arch=x86_64 \
            simulator=yes \
            plugin=video_exporter \
            version=4.0 \
            ios_deployment_target=15.0


      # ==========================================================
      # 14. BUILD RELEASE SIMULATOR ARM64
      # ==========================================================

      - name: Build VideoExporter release simulator arm64
        run: |

          cd godot-ios-plugins

          scons \
            target=release \
            arch=arm64 \
            simulator=yes \
            plugin=video_exporter \
            version=4.0 \
            ios_deployment_target=15.0


      # ==========================================================
      # 15. CRIAR FAT SIMULATOR LIBRARY
      # ==========================================================

      - name: Create release simulator library
        run: |

          cd godot-ios-plugins

          lipo -create \
            "./bin/libvideo_exporter.x86_64-simulator.release.a" \
            "./bin/libvideo_exporter.arm64-simulator.release.a" \
            -output "./bin/libvideo_exporter-simulator.release.a"


      # ==========================================================
      # 16. CRIAR RELEASE XCFRAMEWORK
      # ==========================================================

      - name: Create release XCFramework
        run: |

          cd godot-ios-plugins

          xcodebuild -create-xcframework \
            -library "./bin/libvideo_exporter.arm64-ios.release.a" \
            -library "./bin/libvideo_exporter-simulator.release.a" \
            -output "./bin/video_exporter.release.xcframework"


      # ==========================================================
      # 17. INSPECIONAR RELEASE
      # ==========================================================

      - name: Inspect release VideoExporter
        shell: bash
        run: |

          cd godot-ios-plugins

          echo "======================================"
          echo "STATIC LIBRARY"
          echo "======================================"

          ls -lh \
            bin/libvideo_exporter.arm64-ios.release.a

          echo ""
          echo "======================================"
          echo "XCFRAMEWORK"
          echo "======================================"

          find \
            bin/video_exporter.release.xcframework \
            -maxdepth 3 \
            -print

          echo ""
          echo "======================================"
          echo "INIT / DEINIT SYMBOLS"
          echo "======================================"

          nm -gU \
            bin/libvideo_exporter.arm64-ios.release.a \
            | grep -E \
            'godot_video_exporter_(init|deinit)' \
            || true

          echo ""
          echo "======================================"
          echo "VIDEOEXPORTER SYMBOLS"
          echo "======================================"

          nm -gU \
            bin/libvideo_exporter.arm64-ios.release.a \
            | grep -E \
            'VideoExporter|video_exporter' \
            | head -100 \
            || true


      # ==========================================================
      # 18. GERAR DEBUG
      # ==========================================================

      - name: Build VideoExporter debug
        run: |

          cd godot-ios-plugins

          scons \
            target=debug \
            arch=arm64 \
            plugin=video_exporter \
            version=4.0 \
            ios_deployment_target=15.0

          scons \
            target=debug \
            arch=x86_64 \
            simulator=yes \
            plugin=video_exporter \
            version=4.0 \
            ios_deployment_target=15.0

          scons \
            target=debug \
            arch=arm64 \
            simulator=yes \
            plugin=video_exporter \
            version=4.0 \
            ios_deployment_target=15.0

          lipo -create \
            "./bin/libvideo_exporter.x86_64-simulator.debug.a" \
            "./bin/libvideo_exporter.arm64-simulator.debug.a" \
            -output "./bin/libvideo_exporter-simulator.debug.a"

          xcodebuild -create-xcframework \
            -library "./bin/libvideo_exporter.arm64-ios.debug.a" \
            -library "./bin/libvideo_exporter-simulator.debug.a" \
            -output "./bin/video_exporter.debug.xcframework"


      # ==========================================================
      # 19. VALIDAR XCFRAMEWORKS
      # ==========================================================

      - name: Validate VideoExporter
        shell: bash
        run: |

          cd godot-ios-plugins

          echo "======================================"
          echo "RELEASE XCFRAMEWORK"
          echo "======================================"

          if [ ! -d \
            "bin/video_exporter.release.xcframework"
          ]; then
            echo "ERROR: Release XCFramework missing."
            exit 1
          fi

          echo "OK: Release XCFramework"


          echo ""
          echo "======================================"
          echo "DEBUG XCFRAMEWORK"
          echo "======================================"

          if [ ! -d \
            "bin/video_exporter.debug.xcframework"
          ]; then
            echo "ERROR: Debug XCFramework missing."
            exit 1
          fi

          echo "OK: Debug XCFramework"


          echo ""
          echo "======================================"
          echo "GDIP"
          echo "======================================"

          if [ ! -f \
            "plugins/video_exporter/video_exporter.gdip"
          ]; then
            echo "ERROR: GDIP missing."
            exit 1
          fi

          echo "OK: GDIP"


          echo ""
          echo "======================================"
          echo "VALIDATION COMPLETE"
          echo "======================================"

          echo "OK: VideoExporter"
          echo "OK: H.264"
          echo "OK: AVAssetWriter"
          echo "OK: AVAssetWriterInputPixelBufferAdaptor"
          echo "OK: Release XCFramework"
          echo "OK: Debug XCFramework"


      # ==========================================================
      # 20. CRIAR PACOTE
      # ==========================================================

      - name: Package VideoExporter
        shell: bash
        run: |

          cd godot-ios-plugins

          rm -rf \
            ../VideoExporter-Godot-4.6.3

          mkdir -p \
            ../VideoExporter-Godot-4.6.3

          cp -R \
            bin/video_exporter.release.xcframework \
            ../VideoExporter-Godot-4.6.3/

          cp -R \
            bin/video_exporter.debug.xcframework \
            ../VideoExporter-Godot-4.6.3/

          cp \
            plugins/video_exporter/video_exporter.gdip \
            ../VideoExporter-Godot-4.6.3/

          cp \
            plugins/video_exporter/video_exporter.h \
            ../VideoExporter-Godot-4.6.3/

          cat > ../VideoExporter-Godot-4.6.3/BUILD_INFO.txt << EOF
          ==========================================
          VideoExporter - Godot 4.6.3
          ==========================================

          Plugin:
          VideoExporter

          Implementation:
          AVFoundation / AVAssetWriter

          Container:
          MPEG-4

          Codec:
          H.264

          Input:
          PNG frame sequence

          Output:
          MP4

          API:
          export_frames(frames_directory, output_path, fps)

          Godot:
          4.6.3-stable

          iOS Deployment Target:
          15.0

          Frameworks:
          AVFoundation.framework
          CoreGraphics.framework
          CoreMedia.framework
          CoreVideo.framework
          UIKit.framework

          Architectures:
          arm64 device
          arm64 simulator
          x86_64 simulator

          Build:
          GitHub Actions

          Runner:
          macos-15-intel

          Generated:
          $(date -u)

          ==========================================
          EOF


      # ==========================================================
      # 21. MOSTRAR PACOTE
      # ==========================================================

      - name: Show package
        run: |

          echo "======================================"
          echo "FINAL PACKAGE"
          echo "======================================"

          find \
            VideoExporter-Godot-4.6.3 \
            -maxdepth 2 \
            -print

          echo ""
          echo "======================================"
          echo "PACKAGE SIZE"
          echo "======================================"

          du -sh \
            VideoExporter-Godot-4.6.3


      # ==========================================================
      # 22. CRIAR ZIP
      # ==========================================================

      - name: Create ZIP
        run: |

          zip -r \
            VideoExporter-Godot-4.6.3.zip \
            VideoExporter-Godot-4.6.3


      # ==========================================================
      # 23. PUBLICAR ARTIFACT
      # ==========================================================

      - name: Upload VideoExporter artifact
        uses: actions/upload-artifact@v4

        with:
          name: VideoExporter-Godot-4.6.3
          path: VideoExporter-Godot-4.6.3.zip
          if-no-files-found: error
          retention-days: 30
